name: Flutter Merchant Android

on:
  push:
    branches: [main]
    paths:
      - "apps/flutter/merchant_app/**"
      - ".github/workflows/flutter-merchant-android.yml"
  workflow_dispatch:

jobs:
  build-android:
    name: Build merchant APK and AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter/merchant_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org tech.botlly .

      - name: Configure Android permissions
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = manifest_path.read_text(encoding="utf-8")
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
          ]
          missing = [permission for permission in permissions if permission not in manifest]
          if missing:
              insert_at = manifest.find("<application")
              if insert_at == -1:
                  raise SystemExit("AndroidManifest.xml has no <application> tag")
              manifest = f"{manifest[:insert_at]}{chr(10).join(missing)}{chr(10)}    {manifest[insert_at:]}"
              manifest_path.write_text(manifest, encoding="utf-8")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: flutter analyze lib

      - name: Build debug APK
        run: >
          flutter build apk
          --debug
          --dart-define=BOTLLY_API_BASE_URL=https://bot-lly.tech

      - name: Build install APK
        run: >
          flutter build apk
          --release
          --dart-define=BOTLLY_API_BASE_URL=https://bot-lly.tech

      - name: Build release app bundle
        run: >
          flutter build appbundle
          --release
          --dart-define=BOTLLY_API_BASE_URL=https://bot-lly.tech

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: botlly-merchant-debug-apk
          path: apps/flutter/merchant_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload install APK
        uses: actions/upload-artifact@v4
        with:
          name: botlly-merchant-install-apk
          path: apps/flutter/merchant_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: botlly-merchant-release-aab
          path: apps/flutter/merchant_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
