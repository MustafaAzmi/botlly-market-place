name: Flutter Customer and Fitter Android

on:
  push:
    branches: [main]
    paths:
      - "apps/flutter/**"
      - "src/lib/customer.functions.ts"
      - "src/lib/fitter.functions.ts"
      - "src/lib/eventStore.server.ts"
      - "src/lib/car-data.ts"
      - "src/lib/whatsapp/send.server.ts"
      - "src/routes/api/customer/mobile.ts"
      - "src/routes/api/fitter/mobile.ts"
      - ".github/workflows/flutter-customer-fitter-android.yml"
      - "apps/flutter/customer_app/tool/configure_platforms.py"
      - "apps/flutter/fitter_app/tool/configure_platforms.py"
  workflow_dispatch:

jobs:
  build-android:
    name: Build ${{ matrix.app.label }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - id: customer_app
            label: customer
            artifact: botlly-customer-install-apk
          - id: fitter_app
            label: fitter
            artifact: botlly-fitter-install-apk

    defaults:
      run:
        working-directory: apps/flutter/${{ matrix.app.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org tech.botlly .

      - name: Configure Android app id and permissions
        run: python tool/configure_platforms.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Build release APK
        run: >
          flutter build apk
          --release
          --dart-define=BOTLLY_API_BASE_URL=https://bot-lly.tech

      - name: Build debug APK for emulator testing
        run: >
          flutter build apk
          --debug
          --dart-define=BOTLLY_API_BASE_URL=https://bot-lly.tech

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.artifact }}
          path: apps/flutter/${{ matrix.app.id }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.artifact }}-debug
          path: apps/flutter/${{ matrix.app.id }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
