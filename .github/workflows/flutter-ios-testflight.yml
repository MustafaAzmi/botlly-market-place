name: Flutter iOS Signed IPA and TestFlight

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to build"
        required: true
        default: customer
        type: choice
        options:
          - customer
          - fitter
          - merchant
      upload_to_testflight:
        description: "Upload the signed IPA to TestFlight"
        required: true
        default: false
        type: boolean

jobs:
  build-signed-ipa:
    name: Build signed ${{ inputs.app }} IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select app settings
        shell: bash
        run: |
          case "${{ inputs.app }}" in
            customer)
              echo "APP_DIR=apps/flutter/customer_app" >> "$GITHUB_ENV"
              echo "APP_LABEL=customer" >> "$GITHUB_ENV"
              echo "BUNDLE_ID=tech.botlly.customer" >> "$GITHUB_ENV"
              echo "PROFILE_BASE64=${{ secrets.IOS_CUSTOMER_PROVISION_PROFILE_BASE64 }}" >> "$GITHUB_ENV"
              ;;
            fitter)
              echo "APP_DIR=apps/flutter/fitter_app" >> "$GITHUB_ENV"
              echo "APP_LABEL=fitter" >> "$GITHUB_ENV"
              echo "BUNDLE_ID=tech.botlly.fitter" >> "$GITHUB_ENV"
              echo "PROFILE_BASE64=${{ secrets.IOS_FITTER_PROVISION_PROFILE_BASE64 }}" >> "$GITHUB_ENV"
              ;;
            merchant)
              echo "APP_DIR=apps/flutter/merchant_app" >> "$GITHUB_ENV"
              echo "APP_LABEL=merchant" >> "$GITHUB_ENV"
              echo "BUNDLE_ID=tech.botlly.merchant" >> "$GITHUB_ENV"
              echo "PROFILE_BASE64=${{ secrets.IOS_MERCHANT_PROVISION_PROFILE_BASE64 }}" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Verify signing secrets
        shell: bash
        run: |
          missing=0
          for name in APPLE_TEAM_ID IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing"
              missing=1
            fi
          done
          if [ -z "$PROFILE_BASE64" ]; then
            echo "::error::Provisioning profile secret for $APP_LABEL is missing"
            missing=1
          fi
          exit "$missing"
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project files
        working-directory: ${{ env.APP_DIR }}
        run: flutter create --platforms=ios --org tech.botlly .

      - name: Configure generated platforms
        working-directory: ${{ env.APP_DIR }}
        run: python3 tool/configure_platforms.py

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Setup CocoaPods
        run: sudo gem install cocoapods -v 1.16.2

      - name: Install Apple signing certificate and provisioning profile
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/ios_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/$APP_LABEL.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" "$PROFILE_PLIST")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_APP_ID=$PROFILE_APP_ID" >> "$GITHUB_ENV"

      - name: Configure Xcode signing
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project_path = Path("ios/Runner.xcodeproj/project.pbxproj")
          project = project_path.read_text(encoding="utf-8")
          signing_settings = {
              "CODE_SIGN_STYLE": "Manual",
              "DEVELOPMENT_TEAM": os.environ["APPLE_TEAM_ID"],
              "PROVISIONING_PROFILE_SPECIFIER": os.environ["PROFILE_NAME"],
              "CODE_SIGN_IDENTITY": "Apple Distribution",
          }

          lines = project.splitlines()
          output = []
          in_build_settings = False
          current_keys = set()

          for line in lines:
              stripped = line.strip()
              if stripped == "buildSettings = {":
                  in_build_settings = True
                  current_keys = set()
                  output.append(line)
                  continue

              if in_build_settings:
                  for key, value in signing_settings.items():
                      if stripped.startswith(f"{key} = "):
                          indent = line[: len(line) - len(line.lstrip())]
                          line = f"{indent}{key} = {value};"
                          current_keys.add(key)
                          break

                  if stripped == "};":
                      for key, value in signing_settings.items():
                          if key not in current_keys:
                              output.append(f"\t\t\t\t{key} = {value};")
                      in_build_settings = False

              output.append(line)

          project = "\n".join(output) + "\n"
          project_path.write_text(project, encoding="utf-8")
          PY

      - name: Create App Store export options
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        continue-on-error: true
        run: flutter analyze lib

      - name: Build signed IPA
        working-directory: ${{ env.APP_DIR }}
        run: >
          flutter build ipa
          --release
          --export-options-plist=ios/ExportOptions.plist
          --dart-define=BOTLLY_API_BASE_URL=https://bot-lly.tech

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: botlly-${{ env.APP_LABEL }}-signed-ipa
          path: ${{ env.APP_DIR }}/build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        working-directory: ${{ env.APP_DIR }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
