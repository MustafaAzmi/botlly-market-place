[build]
  command = "NITRO_PRESET=netlify npm run build"
  publish = "dist/client"
  functions = "dist/server"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/"
  to = "/site-home.html"
  status = 200
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
  force = true

[[redirects]]
  from = "/privacy/"
  to = "/privacy.html"
  status = 200
  force = true

[[redirects]]
  from = "/api/whatsapp/webhook"
  to = "/.netlify/functions/main"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/main"
  status = 200
  force = true
