[build]
  command = "NITRO_PRESET=netlify npm run build && rm -rf dist/server/node_modules && npm install --prefix dist/server --omit=dev"
  publish = "dist/client"
  functions = "dist/server"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
