[build]
  command = "NITRO_PRESET=netlify npm run build"
  publish = "dist/client"
  functions = "dist/server"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
  force = true

[[redirects]]
  from = "/privacy/"
  to = "/privacy.html"
  status = 200
  force = true

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/icons/*"
  to = "/icons/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/manifest-customer.webmanifest"
  to = "/manifest-customer.webmanifest"
  status = 200
  force = false

[[redirects]]
  from = "/manifest-merchant.webmanifest"
  to = "/manifest-merchant.webmanifest"
  status = 200
  force = false

[[redirects]]
  from = "/manifest-fitter.webmanifest"
  to = "/manifest-fitter.webmanifest"
  status = 200
  force = false

[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200
  force = false

[[redirects]]
  from = "/offline.html"
  to = "/offline.html"
  status = 200
  force = false

[[redirects]]
  from = "/api/whatsapp/webhook"
  to = "/.netlify/functions/main"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/main"
  status = 200
  force = false

[[headers]]
  for = "/sw.js"
  [headers.values]
    cache-control = "no-cache"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    content-type = "application/manifest+json; charset=utf-8"
    cache-control = "no-cache"
