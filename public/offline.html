<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>بوتلي — لا يوجد اتصال</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
      }
      .icon {
        font-size: 56px;
      }
      h1 {
        font-size: 20px;
        margin: 16px 0 8px;
      }
      p {
        color: #64748b;
        font-size: 14px;
        line-height: 1.7;
      }
      button {
        margin-top: 20px;
        border: 0;
        background: #16a34a;
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 12px 28px;
        border-radius: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تأكد من اتصالك بالشبكة ثم حاول مرة أخرى. بياناتك محفوظة وما راح تضيع.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
